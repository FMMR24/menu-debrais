<script>
  // Abre o menu na língua do telemóvel do cliente (PT por defeito)

    var l = (navigator.language || 'pt').slice(0,2).toLowerCase();
    location.replace(l === 'en' ? 'menu-en.html' : l === 'es' ? 'menu-es.html' : 'menu-pt.html');
  })();
</script>

  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; gap:20px; background:#262524; font-family:sans-serif; letter-spacing:.14em; }

</style>
</head>
